<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeatLink</title><link rel="stylesheet" href="style.css"></head><body><header><div><img src="icons/icon48.png" alt=""><h1>NeatLink</h1></div><a class="brand-link" href="privacy.html" target="_blank">Help</a></header><main><div class="eyebrow">CLEANER SHARING</div><h2>Share the link. Skip the clutter.</h2><p class="muted">Preview a link before you share it. Only the listed tracking parameters are removed.</p><label for="url">Link to clean</label><textarea id="url" placeholder="Paste an HTTP or HTTPS link" spellcheck="false"></textarea><div class="row" style="margin-top:10px"><button id="current">Use current tab</button><button id="clean" class="primary">Clean link</button></div><section id="result" class="card" hidden><div class="note-title"><h3>Ready to share</h3><span id="count" class="count"></span></div><textarea id="output" readonly aria-label="Cleaned link" spellcheck="false"></textarea><div id="removed"></div><p class="muted" id="explanation"></p><button id="copy" class="primary" style="width:100%">Copy clean link</button></section><p id="status" class="status" role="status" aria-live="polite"></p></main><footer><span>Private by default · Stored locally</span><span>1.0.0</span></footer><script type="module" src="popup.js"></script></body></html>
