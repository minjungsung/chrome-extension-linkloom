<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkLoom</title><link rel="stylesheet" href="style.css"></head><body><header><div><img src="icons/icon48.png" alt=""><h1>LinkLoom</h1></div><a class="brand-link" href="privacy.html" target="_blank">Help</a></header><main><div class="eyebrow">LINKS, READY TO GO</div><h2>Copy the link.<br>Leave the clutter.</h2><section class="daily-card"><p id="current-info" class="muted">Reading the current page…</p><p id="current-preview" class="preview"></p><button id="quick-copy" class="primary full" disabled>Copy clean link</button><p class="muted" id="current-detail">You choose when to copy. The page is never changed.</p></section><details id="batch"><summary>Clean a list or copy Markdown</summary><label for="url">One link or one link per line</label><textarea id="url" placeholder="https://example.com/article?utm_source=email" spellcheck="false" style="min-height:100px"></textarea><div class="row" style="margin-top:9px"><button id="current">Current tab</button><button id="clean" class="primary">Clean links</button></div><section id="result" hidden><div class="row result-summary"><strong id="count"></strong><span id="link-count" class="muted"></span></div><div id="results" class="results"></div><label for="format">Copy format</label><select id="format"><option value="plain">Plain URLs</option><option value="markdown">Markdown list</option></select><div class="row" style="margin-top:10px"><button id="copy" class="primary">Copy results</button><button id="export">Export text</button></div><textarea id="output" readonly aria-label="Formatted cleaned links" spellcheck="false" style="min-height:70px;margin-top:10px"></textarea></section></details><p id="status" class="status" role="status" aria-live="polite"></p></main><footer><span>Local processing · No link history</span><span>1.2.0</span></footer><script type="module" src="popup.js"></script></body></html>
